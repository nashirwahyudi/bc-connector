name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bc-connector

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            IMAGE="ghcr.io/${{ github.repository_owner }}/bc-connector:latest"
            ENV_FILE="${{ secrets.ENV_FILE_PATH || '/opt/bc-connector/.env' }}"

            docker pull "$IMAGE"
            docker stop bc-connector || true
            docker rm bc-connector || true

            docker run -d \
              --name bc-connector \
              --network nginx-proxy \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -e VIRTUAL_HOST="${{ secrets.APP_DOMAIN }}" \
              -e VIRTUAL_PORT=3000 \
              "$IMAGE"
